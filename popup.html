<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyes Only</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <h1>Eyes Only</h1>
    <p class="subtitle">Eye tracking navigation</p>

    <div class="controls">
      <button id="startBtn" class="btn btn-start" type="button">Start Eye Control</button>
      <button id="stopBtn" class="btn btn-stop" type="button" disabled>Stop Eye Control</button>
    </div>

    <div class="setting">
      <label for="sensitivity">Sensitivity</label>
      <div class="slider-row">
        <input id="sensitivity" type="range" min="1" max="5" step="0.5" value="2">
        <span id="sensitivityValue">2x</span>
      </div>
    </div>

    <div class="setting">
      <label for="smoothing">Smoothing</label>
      <div class="slider-row">
        <input id="smoothing" type="range" min="0.05" max="0.5" step="0.05" value="0.1">
        <span id="smoothingValue">0.1</span>
      </div>
    </div>

    <div id="status" class="status" aria-live="polite">Ready</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
