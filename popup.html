<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sightline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="card" class="card">
    <h1 class="title">Sightline</h1>
    <p class="subtitle">Navigate the web with just your eyes.</p>

    <div class="controls">
      <button id="activateBtn" class="btn btn-filled" type="button">Activate</button>
      <button id="deactivateBtn" class="btn btn-outlined" type="button">Deactivate</button>
      <button id="zoomBtn" class="btn btn-filled" type="button">Zoom</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
